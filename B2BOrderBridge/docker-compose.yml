name: order-bridge

services:
  api:
    container_name: order-bridge-api
    build:
      context: .
      dockerfile: OrderBridge/OrderBridge.Presentation/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__OrderBridge: Host=postgres;Port=5432;Database=${POSTGRES_DB:-orderbridge};Username=${POSTGRES_USER:-orderbridge};Password=${POSTGRES_PASSWORD:-orderbridge_dev}
      Persistence__ApplyMigrationsOnStartup: "true"
    ports:
      - "${API_PORT:-8088}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    container_name: order-bridge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-orderbridge}
      POSTGRES_USER: ${POSTGRES_USER:-orderbridge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orderbridge_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - order-bridge-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  order-bridge-postgres-data:
