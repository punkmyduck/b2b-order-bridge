name: order-bridge

services:
  web:
    container_name: order-bridge-web
    build:
      context: .
      dockerfile: src/Web/OrderBridge.Web/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      OrdersApi__BaseUrl: http://orders-api:8080/
      IntegrationsApi__BaseUrl: http://integrations-api:8080/
    ports:
      - "${WEB_PORT:-8090}:8080"
    networks: [edge]
    depends_on:
      orders-api:
        condition: service_healthy

  orders-api:
    build:
      context: .
      dockerfile: src/Services/Orders/OrderBridge.Orders.Api/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Orders: Host=orders-db;Port=5432;Database=orders;Username=orders;Password=${ORDERS_DB_PASSWORD:-orders_dev}
      Persistence__ApplyMigrationsOnStartup: "true"
      Kafka__BootstrapServers: kafka:19092
    ports:
      - "${ORDERS_API_PORT:-8088}:8080"
    networks: [edge, messaging, orders-data]
    depends_on:
      orders-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/health/ready >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  orders-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: ${ORDERS_DB_PASSWORD:-orders_dev}
    ports:
      - "127.0.0.1:${ORDERS_DB_PORT:-5433}:5432"
    networks: [orders-data]
    volumes:
      - order-bridge-orders-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  integrations-api:
    build:
      context: .
      dockerfile: src/Services/Integrations/OrderBridge.Integrations.Api/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Integrations: Host=integrations-db;Port=5432;Database=integrations;Username=integrations;Password=${INTEGRATIONS_DB_PASSWORD:-integrations_dev}
      Persistence__ApplyMigrationsOnStartup: "true"
      Kafka__BootstrapServers: kafka:19092
    ports:
      - "${INTEGRATIONS_API_PORT:-8089}:8080"
    networks: [edge, messaging, integrations-data]
    depends_on:
      integrations-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/health/ready >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  integrations-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: integrations
      POSTGRES_USER: integrations
      POSTGRES_PASSWORD: ${INTEGRATIONS_DB_PASSWORD:-integrations_dev}
    ports:
      - "127.0.0.1:${INTEGRATIONS_DB_PORT:-5434}:5432"
    networks: [integrations-data]
    volumes:
      - order-bridge-integrations-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:4.1.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:19093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:19093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes:
      - order-bridge-kafka-data:/var/lib/kafka/data
    networks: [messaging]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s


networks:
  edge:
  messaging:
  orders-data:
  integrations-data:

volumes:
  order-bridge-orders-data:
  order-bridge-integrations-data:
  order-bridge-kafka-data:
